  <style>

    html{
      scroll-behavior:smooth;
    }

    body{
      overflow-x:hidden;
      font-family:Arial,sans-serif;
    }

    .card{
      overflow:hidden;
      transition:.35s;
      border-radius:20px;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .card img{
      transition:.4s;
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card:hover img{
      transform:scale(1.05);
    }

    .hero-overlay{
      background:rgba(0,0,0,.55);
    }

    .whatsapp-float{
      position:fixed;
      width:60px;
      height:60px;
      bottom:25px;
      right:25px;
      background:#25D366;
      color:#fff;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      z-index:999;
      box-shadow:0 10px 25px rgba(0,0,0,.2);
    }

    .gallery img{
      width:100%;
      height:280px;
      object-fit:cover;
      border-radius:18px;
    }

  </style>
</head>

           data-nl="Diensten"

<!-- SCRIPT -->
<script>

const mobileBtn = document.getElementById("mobile-menu-btn");
const mobileMenu = document.getElementById("mobile-menu");

mobileBtn.addEventListener("click", () => {
  mobileMenu.classList.toggle("hidden");
});

function setLang(lang){

  localStorage.setItem("lang", lang);

  document.querySelectorAll("[data-nl]").forEach(el => {

    el.textContent =
      lang === "nl"
      ? el.dataset.nl
      : el.dataset.en;

  });

}

window.onload = () => {

  setLang(localStorage.getItem("lang") || "nl");

};

</script>
